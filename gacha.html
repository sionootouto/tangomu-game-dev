<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#fff8ec">
  <title>割り箸ガチャ | たんごむチャレンジ</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/gacha.css">
</head>
<body class="gacha-body">
  <main class="gacha-page">
    <header class="gacha-header">
      <a class="gacha-back" href="./index.html">← ゲームに戻る</a>
      <div class="gacha-wallet" aria-label="所持Coins">
        <span aria-hidden="true">🪙</span>
        <strong id="gachaCoins">0</strong>
        <span>Coins</span>
      </div>
    </header>

    <section class="gacha-intro" aria-labelledby="gachaTitle">
      <div class="gacha-eyebrow">CHOPSTICKS CHALLENGE</div>
      <h1 id="gachaTitle">割り箸ガチャ</h1>
      <p>祈りを込めて、ぱきっと一本。</p>
    </section>

    <section class="gacha-machine" aria-label="割り箸を割る演出">
      <div class="gacha-glow" aria-hidden="true"></div>
      <div id="gachaStage" class="gacha-stage">
        <svg
          class="chopsticks"
          viewBox="0 0 260 240"
          role="img"
          aria-label="短い端がつながった割り箸"
        >
          <g class="chopstick-piece chopstick-piece-upper">
            <path d="M 12 194 L 200 12 L 217 24 L 27 207 Z"></path>
          </g>
          <g class="chopstick-piece chopstick-piece-lower">
            <path d="M 24 206 L 212 24 L 229 36 L 39 219 Z"></path>
          </g>
          <path class="chopstick-connector" d="M 200 12 L 217 24 L 229 36 L 212 24 Z"></path>
        </svg>
        <span id="gachaStageText" class="gacha-stage-text">
          割り箸を選んでね
        </span>
      </div>
      <div id="gachaBurst" class="gacha-burst" aria-hidden="true"></div>
    </section>

    <p class="gacha-rules">
      1回 <strong>10 Coins</strong> ・ 成功率 <strong>1/3</strong><br>
      成功すると4種類の景品から等確率で1つ。
    </p>

    <div class="gacha-actions">
      <button id="drawGachaOnce" class="gacha-draw-button">
        <span>🥢 1回割る</span>
        <small>10 Coins</small>
      </button>
      <button id="drawGachaTen" class="gacha-draw-button gacha-draw-ten">
        <span>✨ 10回まとめて割る</span>
        <small>100 Coins</small>
      </button>
    </div>

    <p id="gachaStatus" class="gacha-status" role="status" aria-live="polite">
      アイテムはコレクション用。ゲーム内の効果はありません。
    </p>

    <section class="gacha-inventory-section" aria-labelledby="inventoryTitle">
      <div class="gacha-section-heading">
        <h2 id="inventoryTitle">アイテムコレクション</h2>
        <span>重複OK</span>
      </div>
      <div id="gachaInventory" class="gacha-inventory"></div>
    </section>

    <section
      id="gachaResultsSection"
      class="gacha-results-section"
      aria-labelledby="resultsTitle"
      hidden
    >
      <div class="gacha-section-heading">
        <h2 id="resultsTitle">今回の結果</h2>
        <span id="gachaResultSummary"></span>
      </div>
      <ol id="gachaResults" class="gacha-results" aria-live="off"></ol>
    </section>
  </main>

  <script type="module" src="./js/gachaPage.js"></script>
</body>
</html>
